<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RFM - Rohan Fried Momos</title>

  <link rel="icon" type="image/jpeg" href="logo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
      scroll-behavior:smooth;
    }

    body{
      background:#ecfdf5;
      color:#222;
      overflow-x:hidden;
    }

    nav{
      width:100%;
      padding:16px 8%;
      background:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 4px 15px rgba(0,0,0,0.08);
    }

    .logo{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo img{
      width:75px;
      height:75px;
      object-fit:contain;
      border-radius:14px;
    }

    .logo h2{
      color:#dc2626;
      font-size:34px;
      font-weight:800;
    }

    nav ul{
      display:flex;
      list-style:none;
      gap:35px;
    }

    nav ul li a{
      text-decoration:none;
      color:#222;
      font-weight:600;
      transition:0.3s;
    }

    nav ul li a:hover{
      color:#16a34a;
    }

    .btn{
      padding:13px 30px;
      border:none;
      border-radius:40px;
      background:#16a34a;
      color:white;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      font-size:15px;
    }

    .btn:hover{
      background:#15803d;
      transform:translateY(-3px);
    }

    .hero{
      min-height:90vh;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:60px 8%;
      gap:60px;
      flex-wrap:wrap;
    }

    .hero-text{
      flex:1;
      min-width:300px;
    }

    .hero-text h1{
      font-size:78px;
      line-height:1.05;
      margin-bottom:25px;
      font-weight:800;
    }

    .hero-text h1 span{
      color:#dc2626;
    }

    .hero-text p{
      font-size:20px;
      color:#555;
      line-height:1.9;
      margin-bottom:35px;
      max-width:700px;
    }

    .hero-buttons{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }

    .outline-btn{
      padding:13px 30px;
      border-radius:40px;
      border:2px solid #dc2626;
      background:transparent;
      color:#dc2626;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      font-size:15px;
    }

    .outline-btn:hover{
      background:#dc2626;
      color:white;
    }

    .hero-image{
      flex:1;
      display:flex;
      justify-content:center;
      min-width:300px;
    }

    .hero-image img{
      width:100%;
      max-width:480px;
      background:white;
      padding:25px;
      border-radius:35px;
      box-shadow:0 20px 40px rgba(0,0,0,0.15);
    }

    .section{
      padding:100px 8%;
    }

    .section-title{
      text-align:center;
      margin-bottom:70px;
    }

    .section-title h2{
      font-size:50px;
      color:#16a34a;
      margin-bottom:12px;
    }

    .section-title p{
      color:#666;
      font-size:18px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:35px;
    }

    .card{
      background:white;
      border-radius:25px;
      overflow:hidden;
      box-shadow:0 12px 28px rgba(0,0,0,0.08);
      transition:0.4s;
    }

    .card:hover{
      transform:translateY(-10px);
    }

    .card img{
      width:100%;
      height:240px;
      object-fit:cover;
    }

    .card-content{
      padding:25px;
      text-align:center;
    }

    .card-content h3{
      font-size:28px;
      color:#dc2626;
      margin-bottom:12px;
    }

    .card-content p{
      color:#555;
      line-height:1.7;
    }

    .price{
      margin-top:18px;
      font-size:24px;
      font-weight:700;
    }

    .about{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:60px;
      flex-wrap:wrap;
    }

    .about-image{
      flex:1;
      display:flex;
      justify-content:center;
      min-width:300px;
    }

    .about-image img{
      width:100%;
      max-width:420px;
      background:white;
      padding:25px;
      border-radius:35px;
      box-shadow:0 20px 40px rgba(0,0,0,0.15);
    }

    .about-text{
      flex:1;
      min-width:300px;
    }

    .about-text h2{
      font-size:52px;
      color:#16a34a;
      margin-bottom:20px;
    }

    .about-text p{
      font-size:18px;
      line-height:1.9;
      color:#555;
      margin-bottom:20px;
    }

    .contact-box{
      background:#dc2626;
      color:white;
      text-align:center;
      padding:80px 30px;
      border-radius:35px;
    }

    .contact-box h2{
      font-size:52px;
      margin-bottom:15px;
    }

    .contact-box p{
      font-size:20px;
      margin-bottom:30px;
    }

    footer{
      text-align:center;
      padding:30px;
      color:#666;
      background:white;
      margin-top:50px;
      font-size:15px;
    }

    #menuPopup,
    #shopPopup{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    .popup-box{
      background:white;
      width:90%;
      max-width:700px;
      padding:40px;
      border-radius:25px;
      position:relative;
      animation:popup 0.3s ease;
      max-height:90vh;
      overflow-y:auto;
    }

    .close-btn{
      position:absolute;
      top:15px;
      right:20px;
      border:none;
      background:none;
      font-size:28px;
      cursor:pointer;
      color:#16a34a;
    }

    @keyframes popup{
      from{
        transform:scale(0.7);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    @media(max-width:950px){

      nav ul{
        display:none;
      }

      .hero{
        flex-direction:column;
        text-align:center;
      }

      .hero-text h1{
        font-size:55px;
      }

      .about{
        flex-direction:column;
      }

      .about-text{
        text-align:center;
      }
    }

  </style>
</head>

<body>

  <nav>

    <div class="logo">
      <img src="logo.jpeg" alt="RFM Logo">
      <h2>RFM</h2>
    </div>

    <ul>
      <li><a href="#home">Home</a></li>

      <li>
        <a href="javascript:void(0);" onclick="openMenuPopup()">
          Menu
        </a>
      </li>

      <li><a href="#about-section">About</a></li>

      <li><a href="#contact-section">Contact</a></li>
    </ul>

    <a href="https://forms.gle/tXxe6JmkZTjjhXGz6" target="_blank">
      <button class="btn">Order Now</button>
    </a>

  </nav>

  <section class="hero" id="home">

    <div class="hero-text">

      <h1>
        Crispy & Delicious <span>Fried Momos</span>
      </h1>

      <p>
        Welcome to RFM – Rohan Fried Momos.
        We serve hot, crispy, cheesy and spicy momos with unforgettable taste.
      </p>

      <div class="hero-buttons">

        <a href="https://forms.gle/tXxe6JmkZTjjhXGz6" target="_blank">
          <button class="btn">Order Now</button>
        </a>

        <button class="outline-btn" onclick="openShopPopup()">
          Visit Shop
        </button>

      </div>

    </div>

    <div class="hero-image">
      <img src="logo.jpeg" alt="RFM Logo">
    </div>

  </section>

</body>
</html>
